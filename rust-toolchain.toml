[toolchain]
# Pinned stable toolchain for the whole workspace.
#
# Floor is set by the wasmtime 47 plugin runtime (`rust-version = 1.94.0`);
# pinning an exact patch release keeps CI, agents and local dev on one
# compiler so `[workspace.lints]` denies fire identically everywhere.
channel = "1.97.1"
components = ["rustfmt", "clippy"]
# wasm32-unknown-unknown — the Dioxus WASM client bundle.
# wasm32-wasip1        — the WASM Component Model plugin guests. Required by
#   `.cargo/config.toml` and `crates/plugin-host-tests`, which reads
#   `target/wasm32-wasip1/debug`. Without it listed here rustup auto-installs
#   it on first use, turning a plugin-host test run into a network fetch that
#   can (and did) fail mid-suite on a corrupted partial download.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
profile = "minimal"
