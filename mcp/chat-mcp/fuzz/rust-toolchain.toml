# cargo fuzz requires nightly to build the libfuzzer-sys instrumented binary.
# This file is scoped to mcp/chat-mcp/fuzz/ only; the workspace itself still
# builds on stable (see the pinned `rust-toolchain.toml` at the repo root and
# `[workspace.package] rust-version` in the root Cargo.toml).
[toolchain]
channel = "nightly"
components = ["rust-src", "llvm-tools-preview"]
