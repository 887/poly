# cargo-deny — supply-chain gate for the Poly workspace.
#
# Plan: docs/plans/plan-host-substrate-capability-gating.md Phase E.
# CI entry point: the `supply-chain` job in .github/workflows/lint-test.yml,
# which runs `cargo deny check advisories bans sources licenses`.
# Locally: `cargo deny check` (cargo-deny 0.20.x).
#
# Policy shape mirrors this repo's lint gate: everything the tree carries today
# is grandfathered by an *explicit, individually justified* entry, and anything
# new fails the build. There is no blanket "warn" escape hatch — a muted class
# is a gate that has stopped gating.

[graph]
# Only the platforms Poly actually ships. Keeps the advisory/ban graph from
# resolving dependency trees no Poly binary ever links.
#
# The two `wasip*` entries are load-bearing, not decoration. Nine guest crates
# under `clients/` declare `[target.'cfg(target_os = "wasi")'.dependencies]`
# (forgejo, server-client, stoat, matrix, discord, …) — that is the dependency
# surface which is compiled *into the WASM sandbox* this repo's plugin-host
# gates. Omitting the wasi targets resolves those subtrees away, so the gate
# silently stops auditing exactly the code the sandbox is meant to contain, and
# any dependency moved behind a `cfg(target_os = "wasi")` gate becomes invisible
# to advisories, licences and bans. Adding them surfaced two real duplicate
# pairs (`wasmparser`, `wit-parser`) that the host-only graph missed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
    "wasm32-wasip2",
]
all-features = false

[output]
feature-depth = 1

# ── Advisories ────────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Report unmaintained crates anywhere in the graph, not just direct workspace
# deps. The EOL gtk-rs cluster below is entirely transitive, so
# `unmaintained = "workspace"` would hide the exact thing this gate exists for.
#
# NOTE: plan E.1 said `unmaintained = "warn"`. cargo-deny removed the per-class
# severity strings in 0.16; 0.20 accepts "all" | "workspace" | "transitive" |
# "none". "all" is the strict reading of the plan's intent.
unmaintained = "all"
yanked = "deny"

# Every entry below carries a reason and a re-open trigger. An id here without
# both is a review failure.
#
# DELIBERATELY NOT IGNORED — these are one-command lockfile fixes, not accepted
# risk, and the gate stays red until they land:
#   RUSTSEC-2026-0193 / RUSTSEC-2026-0213  ammonia 4.1.2 XSS + mXSS
#                                    -> `cargo update -p ammonia` (>= 4.1.4)
#   RUSTSEC-2026-0204  crossbeam-epoch invalid pointer dereference
#                                    -> `cargo update -p crossbeam-epoch` (>= 0.9.20)
#   yanked `spin`                    -> `cargo update -p spin`
# Cargo.lock was outside the file ownership of the change that added this file,
# so these are raised as blocked findings rather than silently grandfathered.
ignore = [
    # ── EOL gtk-rs 0.18 generation (all unmaintained, no CVE) ────────────
    # Held by the `cairo-rs = "0.18"` / `wry = "0.53"` / `tao = "0.34"` pins.
    # Owner + expiry story: docs/plans/plan-desktop-gtk-stack-bump.md.
    # Re-open trigger: that plan's Phase D.1 deletes this whole block once
    # `cargo tree -i glib` shows 0.20+. Do not *extend* this list — a new
    # gtk-rs advisory means the bump got later, not that the ignore grew.
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0412", reason = "gdk unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0413", reason = "atk unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0415", reason = "gtk unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11 unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys unmaintained; cleared by plan-desktop-gtk-stack-bump.md" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, pulled by glib-macros/gtk3-macros; falls out with the same bump" },
    #
    # The eleventh gtk-rs id named in plan E.1, RUSTSEC-2024-0429 (glib 0.18.5
    # soundness / GHSA-wrw7-89jp-8q8g), is intentionally ABSENT. The current
    # advisory-db does not match it against our locked glib 0.18.5, so listing
    # it would only emit an `advisory-not-detected` warning — and if the db
    # ever does start matching, a soundness bug underneath crates/host-sandbox
    # (a CLAUDE.md SOLID item 7 security boundary) *should* fail this gate
    # rather than have been pre-silenced.

    # ── No safe upgrade exists upstream ──────────────────────────────────
    # Re-open trigger for all three: cargo-deny prints a `Solution:` line other
    # than "No safe upgrade is available!". Re-check on every dependency bump.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing sidechannel — upstream has no patched release (RustCrypto/RSA#626); reached transitively, not used to hold Poly auth secrets" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained — proc-macro only, no runtime surface, no successor adopted upstream" },
    { id = "RUSTSEC-2026-0150", reason = "audiopus_sys unmaintained — Opus FFI shim under the voice backend; no successor crate published (Lakelezz/audiopus_sys#22)" },
]

# ── Licenses ──────────────────────────────────────────────────────────────
[licenses]
# Permissive-only. Anything copyleft or unlisted fails; adding a license to
# this list is a deliberate legal decision, not a build fix.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.8

# First-party workspace crates are governed by the repo's own LICENSE
# (MIT, `[workspace.package] license = "MIT OR Apache-2.0"`), not by this
# third-party supply-chain gate.
private = { ignore = true }

# BUSL-1.1 is source-available, NOT an OSI licence, so it stays out of `allow`
# and is granted per-crate here instead. This records a pre-existing dependency
# choice; it does not extend to any new BUSL crate, which will still fail.
# Re-open trigger: before Poly ships a redistributable binary linking these,
# the BUSL "Additional Use Grant" has to be read and this block renewed.
[[licenses.exceptions]]
crate = "surrealdb"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-collections"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-core"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-protocol"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-strand"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-types"
allow = ["BUSL-1.1"]

[[licenses.exceptions]]
crate = "surrealdb-types-derive"
allow = ["BUSL-1.1"]

# ── Bans (duplicate versions, banned crates) ──────────────────────────────
[bans]
# Duplicate versions fail. The `skip` list grandfathers exactly what the lock
# carries today — same contract as crates/lint-gate/baseline.json: existing
# duplication is recorded version-by-version, a newly duplicated crate is a
# build error. Regenerate deliberately, never to make a red build green.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

# Grandfathered duplicates, generated from `cargo deny --format json check bans`
# against the lock as of this file landing. Dropping an entry once the tree
# converges is encouraged; adding one needs a reason in the PR description.
